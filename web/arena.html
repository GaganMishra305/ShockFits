<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShockFits - Arena</title>
    <link rel="stylesheet"
      href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="arena.css">
</head>
<body>
    <div class="container wide">
        <header class="arena-header">
            <h1>ShockFits Arena</h1>
            <nav class="arena-nav">
                <a href="index.html">Play</a>
                <a href="arena.html" class="active">Arena</a>
            </nav>
        </header>

        <div class="setup card">
            <div class="fighter">
                <label>White</label>
                <select id="white-select"></select>
            </div>
            <div class="vs">vs</div>
            <div class="fighter">
                <label>Black</label>
                <select id="black-select"></select>
            </div>
            <div class="fighter">
                <label>Opening</label>
                <select id="opening-select"></select>
            </div>
            <button id="run-btn">Run Game</button>
        </div>

        <div id="status" class="status">Pick two fighters and hit Run Game.</div>

        <div class="main-layout">
            <div class="board-section">
                <div id="result-banner" class="result-banner hidden"></div>
                <div id="board"></div>
                <div class="replay-controls">
                    <button id="first-btn" title="Start">&#124;&#9664;</button>
                    <button id="prev-btn" title="Previous">&#9664;</button>
                    <button id="play-btn" title="Autoplay">&#9654; Play</button>
                    <button id="next-btn" title="Next">&#9654;</button>
                    <button id="last-btn" title="End">&#9654;&#124;</button>
                    <span id="ply-indicator" class="ply-indicator">0 / 0</span>
                </div>
            </div>
            <div class="side">
                <div id="matchup" class="matchup"></div>
                <div id="moves-list" class="moves-section"></div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="arena.js"></script>
</body>
</html>
