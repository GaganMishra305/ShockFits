<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboardjs/1.0.0/chessboard.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Chess Game</h1>
            <div class="game-info">
                <div class="status">
                    <span id="status-text">Select game mode to start</span>
                </div>
                <div class="move-counter">
                    Moves: <span id="move-count">0</span>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="board-section">
                <div id="board" style="width: 500px"></div>
                <div class="controls">
                    <button id="reset-btn" class="btn btn-primary">New Game</button>
                    <button id="undo-btn" class="btn btn-secondary">Undo</button>
                    <button id="flip-btn" class="btn btn-secondary">Flip Board</button>
                </div>
            </div>

            <div class="sidebar">
                <div class="game-mode-section">
                    <h2>Game Mode</h2>
                    <div class="mode-buttons">
                        <button id="hvh-btn" class="btn btn-mode active">Human vs Human</button>
                        <button id="hvc-btn" class="btn btn-mode">Human vs Computer</button>
                        <button id="cvc-btn" class="btn btn-mode">Computer vs Computer</button>
                    </div>
                </div>

                <div class="player-section">
                    <h2>Players</h2>
                    <div class="player-info">
                        <div class="player white-player">
                            <div class="player-color">White</div>
                            <div id="white-player-name" class="player-name">-</div>
                        </div>
                        <div class="player black-player">
                            <div class="player-color">Black</div>
                            <div id="black-player-name" class="player-name">-</div>
                        </div>
                    </div>
                </div>

                <div class="moves-section">
                    <h2>Moves</h2>
                    <div id="moves-list" class="moves-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboardjs/1.0.0/chessboard.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
